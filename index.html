<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="imagens/logo-sus.png" type="image/x-icon">
  <title>Login</title>
  <link rel="stylesheet" href="css/index.css">  
</head>
<body>
  <img src="imagens/logo-sus.png" alt="Logo" class="logo"> 

  <div class="login-container">
    <h2>Fazer login</h2>
    <p>Bem-vindo de volta!</p>

    <div class="input-group">
      <img src="imagens/email.svg" alt="Email"> 
      <input type="email" placeholder="Endereço de email">
    </div>

    <div class="input-group">
      <img src="imagens/cadeado.svg" alt="Senha"> 
      <input type="password" placeholder="Senha">
    </div>

    <div class="esqueceu">
      <a href="#">Esqueceu a senha ?</a>
    </div>

    <div class="btn-login">
      <button><a href="home.html">→</a></button>
    </div>

    <div class="cadastro">
      Novo membro? <a href="cadastro.html">Cadastre-se</a>
    </div>
  </div>
</body>
</html>
