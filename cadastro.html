<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/cadastro.css">
  <link rel="shortcut icon" href="imagens/logo-sus.png" type="image/x-icon">
  <title>Cadastro</title>
</head>
<body>
  <img src="imagens/logo-sus.png" alt="Logo" class="logo"> 

  <div class="cadastro-container">
    <h2>Formulário de cadastro</h2>
    <div class="input-group">
      <img src="imagens/person.svg" alt="Nome"> 
      <input type="text" placeholder="Nome completo">
    </div>

    <div class="input-group">
      <img src="imagens/cpf.svg" alt="CPF"> 
      <input type="text" placeholder="CPF">
    </div>

    <div class="input-group">
      <img src="imagens/email.svg" alt="Email"> 
      <input type="email" placeholder="E-mail">
    </div>

    <div class="input-group">
      <img src="imagens/cadeado.svg" alt="Senha"> 
      <input type="password" placeholder="Senha">
    </div>

    <p class="termos">
      Ao se cadastrar, você concorda com nossos Termos de Uso.
    </p>

    <div class="btn-cadastro">
      <button><a href="home.html">→</a> </button>
    </div>

    <div class="login-link">
      Já é membro? <a href="index.html">faça seu login</a>
    </div>
  </div>

</body>
</html>
